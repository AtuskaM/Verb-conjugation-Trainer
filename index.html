const caseNames={1:['nominativ','nominative'],2:['genitiv','genitive'],3:['dativ','dative'],4:['akuzativ','accusative'],6:['lokál','locative'],7:['instrumentál','instrumental']};
function patternEnglish(s){const map={'koho/čeho':'whom/what','koho/co':'whom/what','komu/čemu':'to whom/what','kom/čem':'whom/what','kým/čím':'whom/what','koho':'whom','čeho':'what','komu':'to whom','čemu':'to what','čím':'what','kým':'whom','čem':'what','co':'what','jaký':'what kind','infinitiv':'infinitive','zpaměti':'by heart','písemně':'in writing','česky':'in Czech','teple':'warmly','sebou':'oneself','kdy':'when','kolik':'what time','kde':'where','kam':'where to','odkud':'where from','aby':'so that','že':'that','vedle':'next to','kvůli':'because of','před':'before','pro':'for','za':'for / behind / to see','do':'into / to','od':'from','po':'after','na':'on / for','o':'about / for','s':'with','z':'from / out of','v':'in / at','u':'at','k':'to','jak':'how'};return s.replace(/[a-záčďéěíňóřšťúůýž]+(?:\/[a-záčďéěíňóřšťúůýž]+)?/gi,w=>map[w]||w);}
function collocationHTML(v){return `<ul class="pattern-list">${v.collocations.map(r=>{const cases=[...new Set([...r.pattern.matchAll(/\(([123467])\)/g)].map(m=>m[1]))];return `<li><strong>${esc(r.pattern)}</strong>${isEasy()?' — '+esc(patternEnglish(r.pattern)):''}<br>${esc(r.example)}${isEasy()?' — '+esc(r.english):''}<br><small>${cases.map(n=>n+'. '+B(caseNames[n][0],caseNames[n][1])).join(' · ')}</small></li>`}).join('')}</ul>`;}
function aspectText(v){return v.aspect==='perfective'?B('Dokonavé: děj jako celek, dokončená událost nebo dosažený výsledek.','Perfective: an event as a whole, a completed event or an achieved result.'):B('Nedokonavé: průběh, opakování nebo stav; dokončení se tímto tvarem samo nepotvrzuje.','Imperfective: a process, repetition or state; this form alone does not assert completion.');}
function verbInfo(v){if(!v)return '';const g=groupInfo[v.conjugation_group];return `${isEasy()?`<div class="aspect-info"><strong>${esc(B(v.aspect==='perfective'?'Dokonavé':'Nedokonavé',v.aspect))}</strong><br>${esc(aspectText(v))}${v.aspect_partner?'<br>'+esc(B('Vidový protějšek','Aspect partner'))+': '+esc(v.aspect_partner):''}<br>${esc(B('Skupina časování','Conjugation group'))}: ${esc(g.name)}${v.irregular?' · '+esc(B('Nepravidelné tvary: učte se jednotlivé osoby.','Irregular forms: learn the individual persons.')):''}</div>`:''}<details><summary>${esc(B('Běžné vazby a spojení','Common patterns and combinations'))} (${v.collocations.length})</summary>${collocationHTML(v)}</details>`;}
function renderGuide(){
 $('guide-title').textContent=B('Pravidla: čtyři skupiny, minulost a budoucnost','Rules: four groups, past and future');
 $('guide-content').innerHTML=`<p>${esc(B('Čtyři praktické skupiny pro studenty, podle tvaru já. Infinitiv sám nestačí: psát → píšu, spát → spím. Nepravidelná slovesa jsou zařazena do nejbližší skupiny a označena.','Four practical learner groups based on the I form. The infinitive alone is not enough: psát → píšu, spát → spím. Irregular verbs are placed in the closest group and marked.'))}</p><div class="table-wrap"><table><thead><tr><th>${esc(B('Skupina','Group'))}</th><th>${esc(B('Tvary: já, ty, on/ona, my, vy, oni','Forms: I, you, he/she, we, you, they'))}</th></tr></thead><tbody>${Object.values(groupInfo).map(g=>'<tr><td>'+esc(g.name)+'</td><td>'+esc(g.cz)+(isEasy()?'<br>'+esc(g.en):'')+'</td></tr>').join('')}</tbody></table></div><p>${esc(B('Skupina -u má změny kmene a varianty: číst → čtu, psát → píšu/píši, brát → beru. Skupina -uji zahrnuje i pít → piji/piju. U některých sloves na -ím má oni varianty -í/-ejí. Učte se konkrétní tvary.','The -u group has stem changes and variants: číst → čtu, psát → píšu/píši, brát → beru. The -uji group also includes pít → piji/piju. Some -ím verbs have -í/-ejí variants for they. Learn each verb’s forms.'))}</p><p>${esc(B('Dokonavá slovesa nemají skutečný přítomný čas: udělám znamená budoucnost. V přítomném čase proto procvičujete jen nedokonavá slovesa.','Perfective verbs have no true present tense: udělám has future meaning. Present practice therefore contains only imperfective verbs.'))}</p><div class="table-wrap"><table><thead><tr><th>${esc(B('Čas','Tense'))}</th><th>${esc(B('Nedokonavé: průběh / opakování','Imperfective: process / repetition'))}</th><th>${esc(B('Dokonavé: celek / výsledek','Perfective: whole event / result'))}</th></tr></thead><tbody><tr><td>${esc(B('Minulost','Past'))}</td><td>Včera jsem psala dopis.${isEasy()?'<br>Yesterday I was writing / wrote a letter (process; completion not asserted).':''}</td><td>Včera jsem napsala dopis.${isEasy()?'<br>Yesterday I wrote and completed a letter.':''}</td></tr><tr><td>${esc(B('Budoucnost','Future'))}</td><td>Zítra budu psát dopis.${isEasy()?'<br>Tomorrow I will write / be writing a letter (process).':''}</td><td>Zítra napíšu dopis.${isEasy()?'<br>Tomorrow I will write and complete a letter.':''}</td></tr></tbody></table></div><p>${esc(B('Minulost: oba vidy používají minulý tvar + jsem/jsi…; rozdíl je ve významu slovesa, ne v pomocném slovese. Pro já: psal jsem / psala jsem; napsal jsem / napsala jsem.','Past: both aspects use a past participle + jsem/jsi…; the difference is in the verb’s meaning, not the auxiliary. For I: psal jsem / psala jsem; napsal jsem / napsala jsem.'))}</p><p>${esc(B('Budoucnost: nedokonavé obvykle budu + infinitiv; dokonavé napíšu, koupím, udělám bez budu. Výjimky: být → budu, jít → půjdu, jet → pojedu.','Future: imperfective usually uses budu + infinitive; perfective uses napíšu, koupím, udělám without budu. Exceptions: být → budu, jít → půjdu, jet → pojedu.'))}</p><p>${esc(B('Český vid není totéž co anglický simple/progressive. Nedokonavé může být anglicky I write i I am writing. Jít a chodit jsou obě nedokonavá; jednorázový směr a opakovaný pohyb nejsou totéž co dokonavost.','Czech aspect does not match English simple/progressive exactly. Imperfective can mean both I write and I am writing. Jít and chodit are both imperfective; directed and habitual motion are not the same distinction as aspect.'))}</p><p>${esc(B('Vazby ukazují běžné doplnění slovesa i praktická spojení místa, času nebo způsobu. Číslo v závorce je pád; nejde o úplný slovníkový seznam.','Patterns show common verb complements and useful place, time or manner combinations. The number in brackets is the case; this is a selected list, not an exhaustive dictionary.'))}</p>`;
}
function renderDictionary(){const query=clean($('verb-search').value);const matches=verbs.filter(v=>clean(v.verb).includes(query)||(isEasy()&&clean(v.english).includes(query)));$('dictionary-results').innerHTML=matches.length?matches.map(v=>`<article class="verb-entry"><strong>${esc(v.verb)}${isEasy()?' — '+esc(v.english):''}</strong>${verbInfo(v)}</article>`).join(''):'<p>'+esc(B('Sloveso není v této databázi 97 sloves.','This verb is not in this 97-verb database.'))+'</p>';}
const originalMakeCards=makeCards;
makeCards=function(){return originalMakeCards().filter(c=>($('group').value==='all'||c.v.conjugation_group===$('group').value)&&($('aspect').value==='all'||c.v.aspect===$('aspect').value));};
const originalLabelUI=labelUI;
labelUI=function(){originalLabelUI();$('label-group').textContent=B('Skupina časování','Conjugation group');$('label-aspect').textContent=B('Slovesný vid','Verb aspect');$('group').options[0].textContent=B('Všechny čtyři skupiny','All four groups');for(const opt of [...$('group').options].slice(1))opt.textContent=groupInfo[opt.value].name;$('aspect').options[0].textContent=B('Oba vidy','Both aspects');$('aspect').options[1].textContent=B('Nedokonavé · průběh / opakování','Imperfective · process / repetition');$('aspect').options[2].textContent=B('Dokonavé · celek / výsledek','Perfective · whole event / result');$('dictionary-title').textContent=B('Slovníček sloves a vazeb','Verb and pattern reference');$('search-label').textContent=B('Hledat sloveso','Search a verb');$('verb-search').placeholder=B('Např. dělat, ptát se','E.g. dělat, ptát se, ask');renderGuide();renderDictionary();$('guide').closest('.panel').hidden=!isEasy();$('source-note').textContent=B('97 sloves · 296 vybraných běžných spojení. Čtyři skupiny jsou praktické skupiny pro studenty.','97 verbs · 296 selected common combinations. The four groups are practical learner groups.');};
const originalShow=show;
show=function(){originalShow();if(!pool.length){current=null;answered=true;$('verb-info').innerHTML='';$('feedback').textContent='';$('answer').value='';$('tag').textContent='';$('count').textContent='';$('prompt').textContent=B('Pro tento výběr nejsou cvičení. Změňte skupinu, vid nebo čas.','No exercises for this selection. Change the group, aspect or tense.');}else{$('verb-info').innerHTML=isEasy()?verbInfo(current.v):'';}};
const originalExplanation=explanation;
explanation=function(c){return originalExplanation(c)+' '+aspectText(c.v)+(c.level==='Present'?' '+B('Skupina','Group')+': '+groupInfo[c.v.conjugation_group].name+' — '+groupInfo[c.v.conjugation_group].cz:'');};
for(const id of ['group','aspect'])$(id).addEventListener('change',reset);
$('verb-search').addEventListener('input',renderDictionary);
document.addEventListener('DOMContentLoaded',()=>{try{verbs=JSON.parse($('verb-data').textContent);reset()}catch(e){$('prompt').textContent='Data se nepodařilo načíst / Verb data could not load.';console.error(e);}});

</script><script src="voice-and-letters.js"></script><p class="subtle" id="source-note" style="max-width:1050px;margin:0 auto 24px;padding:0 18px">Vocabulary levels: Czech A1–A2 reference description. Conjugation data: Wiktionary; <a href="https://czech.mml.ox.ac.uk/static/lexicon/Czech%20Lexicon%20for%20Learners%20-%20JDN.pdf">Oxford Czech Lexicon</a> for <i>najíst se</i>. This first version practices 97 verbs.</p></html>
